name: Bug Report
description: File a bug report to help improve day-trader-india
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for reporting an issue! Please ensure you have tested with the latest commit on `main`.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the bug encountered.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Command to Reproduce
      description: Exact command executed (e.g. `python3 trader-scanner/scan.py orb`).
      placeholder: python3 trader-scanner/scan.py orb
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS version and Python version (`python3 --version`).
